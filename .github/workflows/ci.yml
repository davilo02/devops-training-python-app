# Práctica 3 - GitHub Actions
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, master]
  workflow_dispatch:
    inputs:
      RUN_CD:
        description: 'Ejecutar CD (solo develop/master)'
        type: boolean
        default: false
      DEPLOY_ENV:
        description: 'Entorno de despliegue'
        type: choice
        options:
          - DEV
          - PRO
        default: DEV

env:
  IMAGE_NAME: "contrerasadr/devops-training-python-app:0.0.1"
  APP_URL: "http://localhost:5001/"

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Info
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "SHA:    ${{ github.sha }}"
          echo "OS:     ${{ runner.os }}"
          echo "Runner: ${{ runner.name }}"

      - name: Variables de entorno
        run: |
          echo "IMAGE_NAME: ${{ env.IMAGE_NAME }}"
          echo "APP_URL:    ${{ env.APP_URL }}"

      - name: Inputs (workflow_dispatch)
        run: |
          echo "RUN_CD:     ${{ inputs.RUN_CD }}"
          echo "DEPLOY_ENV: ${{ inputs.DEPLOY_ENV }}"

      - name: Repository variables
        run: |
          echo "REGISTRY_HOST:  ${{ vars.REGISTRY_HOST }}"
          echo "ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}"

      - name: Secrets (enmascarados)
        run: |
          echo "REGISTRY_USER: ${{ secrets.REGISTRY_USER }}"
          echo "REGISTRY_PASSWORD está configurado: ${{ secrets.REGISTRY_PASSWORD != '' }}"
          echo "ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER }}"
          echo "ARTIFACTORY_PASSWORD está configurado: ${{ secrets.ARTIFACTORY_PASSWORD != '' }}"
