
# Práctica 3 - GitHub Actions
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, master]
  workflow_dispatch:
    inputs:
      RUN_CD:
        description: 'Ejecutar CD (solo develop/master)'
        type: boolean
        default: false

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Info
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "SHA:    ${{ github.sha }}"
          echo "OS:     ${{ runner.os }}"
          echo "Runner: ${{ runner.name }}"
