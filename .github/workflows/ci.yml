# Práctica 3 - GitHub Actions
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, master]
  workflow_dispatch:
    inputs:
      RUN_CD:
        description: 'Ejecutar CD (solo develop/master)'
        type: boolean
        default: false
      DEPLOY_ENV:
        description: 'Entorno de despliegue'
        type: choice
        options:
          - DEV
          - PRO
        default: DEV

env:
  IMAGE_NAME: "contrerasadr/devops-training-python-app:0.0.1"
  APP_URL: "http://localhost:5001/"

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    container: python:3.6-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Info
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "SHA:    ${{ github.sha }}"
          echo "Python: $(python --version)"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: pytest -q

      - name: Variables y secrets
        run: |
          echo "IMAGE_NAME:      ${{ env.IMAGE_NAME }}"
          echo "REGISTRY_HOST:   ${{ vars.REGISTRY_HOST }}"
          echo "ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}"
          echo "RUN_CD:          ${{ inputs.RUN_CD }}"
          echo "DEPLOY_ENV:      ${{ inputs.DEPLOY_ENV }}"
