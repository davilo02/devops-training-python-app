# Práctica 3 - GitHub Actions
name: CI/CD

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, master]
  workflow_dispatch:
    inputs:
      RUN_CD:
        description: 'Ejecutar CD (solo develop/master)'
        type: boolean
        default: false
      DEPLOY_ENV:
        description: 'Entorno de despliegue'
        type: choice
        options:
          - DEV
          - PRO
        default: DEV

env:
  IMAGE_NAME: "contrerasadr/devops-training-2025-python-app:0.0.1"
  APP_URL: "http://localhost:5001/"

jobs:
  ci-test:
    name: CI - Tests
    runs-on: ubuntu-latest
    container: python:3.6-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Info
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "SHA:    ${{ github.sha }}"
          echo "Python: $(python --version)"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: pytest -q

  ci-build:
    name: CI - Build Docker
    runs-on: ubuntu-latest
    needs: [ci-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          echo "Building image: ${{ env.IMAGE_NAME }}"
          docker build -t "${{ env.IMAGE_NAME }}" -f devops/Dockerfile .

      - name: Verify image
        run: docker images "${{ env.IMAGE_NAME }}"

  cd:
    name: CD
    runs-on: ubuntu-latest
    needs: [ci-build]
    if: >
      (github.ref_name == 'develop' || github.ref_name == 'master')
      && inputs.RUN_CD == true
    env:
      DEPLOY_ENV: ${{ github.ref_name == 'master' && 'PRO' || 'DEV' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy (simulado)
        run: |
          echo "Deploying to ${{ env.DEPLOY_ENV }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Image:  ${{ env.IMAGE_NAME }}"
          echo "URL:    ${{ env.APP_URL }}"
